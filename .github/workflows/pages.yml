# Publishes the landing page to GitHub Pages. scripts/build-site.mjs renders it from the
# catalog and every SKILL.md frontmatter, so the published page follows the repository
# with no file to keep in sync by hand.
#
# This repository already uses GitHub Actions as its Pages source. A new fork enables it
# once under Settings → Pages; until then only the deploy job fails.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The default token is read-only; deploying needs these two on top.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Render the page
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
